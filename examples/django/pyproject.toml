[project]
name = "hue-example-django"
version = "0.1.0"
description = "A small Django app built on hue, for trying components against a real database"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.0",
    "hue-ui>=0.0.1",
    "hue-django>=0.1.0",
]

[tool.uv.sources]

hue-ui = { path = "../../hue-python", editable = true }
hue-django = { path = "../../hue-django", editable = true }

[dependency-groups]
dev = [
    "deptry>=0.24.0",
    "django-stubs>=5.2.7",
    "mypy>=1.18.2",
    "pytest>=9.0.1",
    "pytest-django>=4.11.1",
    "ruff>=0.14.4",
]

[tool.ruff]
extend = "../../ruff.toml"
# Written by makemigrations, and rewritten by it next time.
extend-exclude = ["example/invoices/migrations", "example/events/migrations"]

########
# Mypy #
########

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "example.settings"

##########
# Deptry #
##########

[tool.deptry]
# The distribution is hue-ui but the import is hue, and an editable install
# does not tell deptry that.
package_module_name_map = { "hue-ui" = "hue" }
known_first_party = ["example"]

##########
# Pytest #
##########

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example.settings"
# htmy calls a function Python 3.14 deprecates; nothing here can change that.
filterwarnings = ["ignore::DeprecationWarning:htmy.*"]
