[project]
name = "hue-django"
version = "0.0.1"
description = "Django integration for the hue component library"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Daniel Kjellid", email = "daniel@kjellid.no" },
]
dependencies = [
    "hue-ui==0.0.1",
    "django>=5.0",
    "htmy>=0.8.2",
    "asgiref>=3.10.0",
]

[project.urls]
Repository = "https://github.com/danielkjellid/hue"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv.sources]

hue-ui = { path = "../hue-python", editable = true }

[dependency-groups]
dev = [
    "deptry>=0.24.0",
    "django-stubs>=5.2.7",
    "mypy>=1.18.2",
    "pytest>=9.0.1",
    "ruff>=0.14.4",
]

[tool.ruff]
extend = "../ruff.toml"

##########
# Deptry #
##########

[tool.deptry]
# The distribution is hue-ui but the import is hue, and an editable install
# does not tell deptry that.
package_module_name_map = { "hue-ui" = "hue" }
known_first_party = ["hue_django"]

##########
# Pytest #
##########

[tool.pytest.ini_options]
pythonpath = ["src"]
